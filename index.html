<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal flashcard app with spaced repetition.">
  <meta name="theme-color" content="#2563EB">
  <title>Revision Loop</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- KaTeX for Math / Chem / Physics Formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="top-header">
      <h1 class="header-title">Revision Loop</h1>
      <span class="header-sub">Spaced Repetition</span>
    </header>

    <main>
      <!-- Decks Screen -->
      <section id="screen-decks" aria-labelledby="deck-heading">
        <h2 id="deck-heading" class="screen-title">Your Decks</h2>
        <p class="muted">Pick a deck to study, or create a new one.</p>
      </section>

      <!-- Cards Screen -->
      <section id="screen-cards" aria-labelledby="cards-heading" hidden>
        <h2 id="cards-heading" class="screen-title">Cards</h2>
      </section>

      <!-- Review Screen -->
      <section id="screen-review" aria-labelledby="review-heading" hidden>
        <h2 id="review-heading" class="sr-only">Review</h2>
      </section>

      <!-- Stats Screen -->
      <section id="screen-stats" aria-labelledby="stats-heading" hidden>
        <h2 id="stats-heading" class="screen-title">Stats</h2>
      </section>
    </main>
  </div>

  <!-- Bottom Navigation (CYLTabBar Style) -->
  <nav class="bottom-tab-bar" aria-label="Primary">
    <button type="button" class="tab-btn active" data-target="decks">
      <span class="tab-icon" id="icon-decks"></span>
      <span class="tab-text">Decks</span>
    </button>
    <button type="button" class="tab-btn" data-target="review">
      <span class="tab-icon" id="icon-review"></span>
      <span class="tab-text">Review</span>
    </button>
    
    <!-- Floating Center Action Button -->
    <button type="button" class="tab-center-btn" data-target="cards" aria-label="Add Cards">
      <span id="icon-plus"></span>
    </button>

    <button type="button" class="tab-btn" data-target="stats">
      <span class="tab-icon" id="icon-stats"></span>
      <span class="tab-text">Stats</span>
    </button>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
