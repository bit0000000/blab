<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal flashcard app with spaced repetition.">
  <title>Revision Loop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- All UI inside the four sections is built by js/app.js at runtime. -->
  <header>
    <nav aria-label="Primary">
      <button type="button">Decks</button>
      <button type="button">Review</button>
      <button type="button">Stats</button>
    </nav>
  </header>

  <main>
    <section id="screen-decks" aria-labelledby="deck-heading">
      <h1 id="deck-heading">Decks</h1>
      <p class="muted">Pick a deck to study, or create a new one.</p>
    </section>

    <section id="screen-cards" aria-labelledby="cards-heading" hidden>
      <h2 id="cards-heading">Cards</h2>
    </section>

    <section id="screen-review" aria-labelledby="review-heading" hidden>
      <h1 id="review-heading">Review</h1>
    </section>

    <section id="screen-stats" aria-labelledby="stats-heading" hidden>
      <h1 id="stats-heading">Stats</h1>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
