<body>
  <div class="app-layout">
    <header class="top-header">
      <h1 class="header-title">Revision Loop</h1>
      <button id="open-menu" aria-label="Open menu">☰</button>
    </header>

    <main>
      <section id="screen-decks" aria-labelledby="deck-heading">
        <h1 id="deck-heading">Decks</h1>
        <p class="muted">Pick a deck to study, or create a new one.</p>
      </section>

      <section id="screen-cards" aria-labelledby="cards-heading" hidden>
        <h2 id="cards-heading">Cards</h2>
      </section>

      <section id="screen-review" aria-labelledby="review-heading" hidden>
        <h1 id="review-heading" class="sr-only">Review</h1>
      </section>

      <section id="screen-stats" aria-labelledby="stats-heading" hidden>
        <h1 id="stats-heading">Stats</h1>
      </section>
    </main>
  </div>

  <!-- CYLTabBar-inspired Bottom Navigation -->
  <nav class="bottom-tab-bar" aria-label="Primary">
    <button type="button" class="tab-btn active" data-target="decks">
      <span class="tab-icon">🗂️</span>
      <span class="tab-text">Decks</span>
    </button>
    <button type="button" class="tab-btn" data-target="review">
      <span class="tab-icon">🎴</span>
      <span class="tab-text">Review</span>
    </button>
    
    <!-- Floating Center Action Button (Classic CYLTabBar feature) -->
    <button type="button" class="tab-center-btn" data-target="cards">
      <span>+</span>
    </button>

    <button type="button" class="tab-btn" data-target="stats">
      <span class="tab-icon">📊</span>
      <span class="tab-text">Stats</span>
    </button>
  </nav>

  <!-- Keep your script tags here -->
</body>
